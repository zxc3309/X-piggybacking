<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Reply Review{% endblock %}</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');

        :root {
            --bg: #0d0c0b;
            --surface: #171614;
            --surface-2: #1f1e1c;
            --border: #2c2a27;
            --text: #f0ebe4;
            --text-secondary: #7a7570;
            --accent: #e8a03c;
            --accent-hover: #d4902e;
            --green: #5ec97a;
            --green-hover: #4ab868;
            --red: #e85454;
            --red-hover: #d44040;
            --yellow: #f0c060;
            --orange: #f0844a;
            --brain: #4a9ead;
            --brain-surface: #141c1e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
        }

        .container {
            max-width: 1120px;
            margin: 0 auto;
            padding: 0 16px;
        }

        /* ── Header ── */
        .header {
            position: sticky;
            top: 0;
            background: rgba(13, 12, 11, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            z-index: 100;
            padding: 12px 0;
        }
        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header h1 {
            font-family: 'Syne', sans-serif;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        .header h1 a {
            color: var(--text);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header h1 a::before {
            content: '▸';
            color: var(--accent);
            font-size: 14px;
        }
        .header h1 a:hover { color: var(--accent); }
        /* ── Quota — progress bar ── */
        .quota-badge {
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quota-bar-track {
            display: inline-block;
            width: 72px;
            height: 5px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            position: relative;
            flex-shrink: 0;
        }
        .quota-bar-fill {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            transition: width 0.3s;
        }
        .quota-ok  .quota-bar-fill { background: var(--green); }
        .quota-warn .quota-bar-fill { background: var(--orange); }
        .quota-full .quota-bar-fill { background: var(--red); }
        .quota-ok  .quota-label { color: var(--green); }
        .quota-warn .quota-label { color: var(--orange); }
        .quota-full .quota-label { color: var(--red); }
        .quota-label { font-size: 12px; }

        /* ── Filter tabs — underline style ── */
        .tabs {
            display: flex;
            gap: 0;
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
        }
        .tab {
            padding: 12px 16px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            text-decoration: none;
            white-space: nowrap;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            transition: color 0.15s, border-color 0.15s;
            letter-spacing: 0.02em;
        }
        .tab:hover { color: var(--text); }
        .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
        .tab-count {
            font-size: 11px;
            margin-left: 5px;
            opacity: 0.6;
        }

        /* ── Cards — sharp corners + left border ── */
        .card {
            border: 1px solid var(--border);
            border-left: 3px solid var(--border);
            border-radius: 2px;
            padding: 16px;
            margin: 10px 0;
            background: var(--surface);
            transition: border-color 0.15s;
        }
        .card:hover {
            border-color: var(--text-secondary);
            border-left-color: var(--text-secondary);
        }
        /* Left border color by status */
        .card[data-status="pending"]  { border-left-color: var(--yellow); }
        .card[data-status="approved"] { border-left-color: var(--accent); }
        .card[data-status="sent"]     { border-left-color: var(--green); }
        .card[data-status="rejected"] { border-left-color: var(--red); }
        .card[data-status="failed"]   { border-left-color: var(--red); }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .card-author {
            font-weight: 600;
            font-size: 14px;
        }
        .card-author a {
            color: var(--accent);
            text-decoration: none;
        }
        .card-author a:hover { text-decoration: underline; }
        .card-time {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* ── Status tag — flat, uppercase, monospace ── */
        .card-status {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 2px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 1px solid currentColor;
            display: inline-block;
        }
        .status-pending  { color: var(--yellow); }
        .status-approved { color: var(--accent); }
        .status-sent     { color: var(--green); }
        .status-rejected { color: var(--red); }
        .status-failed   { color: var(--red); }

        /* ── Post content ── */
        .post-content {
            font-size: 14px;
            line-height: 1.7;
            margin: 8px 0;
            color: var(--text);
            white-space: pre-wrap;
            word-break: break-word;
        }
        .post-content.truncated {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* ── Reply preview — quote style ── */
        .reply-preview {
            background: var(--surface-2);
            border-left: 3px solid var(--accent);
            padding: 10px 14px;
            margin: 10px 0;
            border-radius: 0 2px 2px 0;
            font-size: 13px;
            color: var(--text-secondary);
        }
        .reply-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ── Buttons ── */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 18px;
            border: none;
            border-radius: 2px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.15s, opacity 0.15s, color 0.15s;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.02em;
        }
        /* Approve — solid fill */
        .btn-approve {
            background: var(--green);
            color: #0d0c0b;
            font-weight: 700;
        }
        .btn-approve:hover { background: var(--green-hover); }
        /* Reject — dashed border */
        .btn-reject {
            background: transparent;
            color: var(--red);
            border: 1px dashed var(--red);
        }
        .btn-reject:hover { background: rgba(232, 84, 84, 0.08); }
        /* Save — ghost */
        .btn-save {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--border);
        }
        .btn-save:hover { border-color: var(--accent); }
        /* Detail */
        .btn-detail {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }
        .btn-detail:hover { background: var(--surface-2); color: var(--text); }
        /* Back */
        .btn-back {
            background: transparent;
            color: var(--text-secondary);
            border: none;
            padding: 8px 0;
            font-size: 13px;
        }
        .btn-back:hover { color: var(--accent); }
        /* Link */
        .btn-link {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }
        .btn-link:hover { background: var(--surface-2); color: var(--text); }
        .btn-sm { padding: 4px 12px; font-size: 12px; }

        .card-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        /* ── Textarea ── */
        .edit-area {
            width: 100%;
            min-height: 120px;
            padding: 12px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 2px;
            color: var(--text);
            font-size: 14px;
            font-family: 'JetBrains Mono', monospace;
            line-height: 1.6;
            resize: vertical;
        }
        .edit-area:focus {
            outline: none;
            border-color: var(--accent);
        }

        /* ── Char counter ── */
        .char-counter {
            font-size: 12px;
            text-align: right;
            margin-top: 6px;
            color: var(--text-secondary);
        }
        .char-counter.over  { color: var(--red); font-weight: 700; }
        .char-counter.warn  { color: var(--orange); }

        /* Char progress bar */
        .char-bar-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
        }
        .char-bar-track {
            flex: 1;
            height: 3px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            position: relative;
        }
        .char-bar-fill {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            background: var(--green);
            transition: width 0.1s, background 0.1s;
        }
        .char-bar-fill.warn { background: var(--orange); }
        .char-bar-fill.over { background: var(--red); }
        .char-bar-label {
            font-size: 12px;
            color: var(--text-secondary);
            min-width: 72px;
            text-align: right;
            flex-shrink: 0;
        }
        .char-bar-label.over  { color: var(--red); font-weight: 700; }
        .char-bar-label.warn  { color: var(--orange); }

        /* ── Detail page sections ── */
        .section { margin: 20px 0; }
        .section-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
        }
        .original-post {
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 3px solid var(--border);
            border-radius: 2px;
            padding: 16px;
        }
        .error-msg {
            background: rgba(232, 84, 84, 0.08);
            border: 1px solid rgba(232, 84, 84, 0.3);
            border-left: 3px solid var(--red);
            border-radius: 2px;
            padding: 10px 14px;
            font-size: 13px;
            color: var(--red);
            margin: 10px 0;
        }

        /* ── Suggestion boxes ── */
        .suggestion-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent);
            border-radius: 0 2px 2px 0;
            padding: 12px 16px;
        }
        .suggestion-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ── Copy button ── */
        .copy-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--accent);
            padding: 4px 12px;
            border-radius: 2px;
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            font-weight: 600;
            letter-spacing: 0.02em;
            transition: background 0.15s, border-color 0.15s;
        }
        .copy-btn:hover { background: var(--surface-2); border-color: var(--accent); }

        /* ── Empty state ── */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
        .empty-state-icon {
            font-size: 14px;
            letter-spacing: 4px;
            margin-bottom: 20px;
            color: var(--border);
            font-family: 'JetBrains Mono', monospace;
        }
        .empty-state h2 {
            font-family: 'Syne', sans-serif;
            font-size: 18px;
            color: var(--text);
            margin-bottom: 6px;
        }
        .empty-state p { font-size: 13px; }

        /* ── Audit trail table ── */
        .audit-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        .audit-table tr { border-bottom: 1px solid var(--border); }
        .audit-table tr:last-child { border-bottom: none; }
        .audit-key {
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 6px 20px 6px 0;
            width: 90px;
            font-weight: 600;
            vertical-align: top;
        }
        .audit-val {
            color: var(--text);
            padding: 6px 0;
        }

        /* ── Post content rich rendering ── */
        .post-content { white-space: pre-wrap; line-height: 1.7; font-size: 15px; }
        .post-mention { color: var(--accent); text-decoration: none; }
        .post-mention:hover { text-decoration: underline; }
        .post-hashtag { color: var(--accent); opacity: 0.8; }
        .post-cashtag { color: var(--green); font-weight: 600; }
        .post-link { color: var(--accent); text-decoration: underline; text-decoration-style: dotted; }
        .post-link:hover { text-decoration-style: solid; }

        /* ── Brain context panel ── */
        .brain-panel {
            background: var(--brain-surface);
            border: 1px solid var(--border);
            border-left: 3px solid var(--brain);
            border-radius: 2px;
            padding: 16px;
        }
        .brain-panel .section-label { color: var(--brain); }
        .brain-panel h2, .brain-panel h3 {
            font-family: 'Syne', sans-serif;
            color: var(--text);
            margin: 16px 0 8px;
        }
        .brain-panel h2 { font-size: 15px; font-weight: 700; }
        .brain-panel h2:first-child { margin-top: 0; }
        .brain-panel h3 { font-size: 13px; font-weight: 700; }
        .brain-panel strong { color: var(--text); font-weight: 600; }
        .brain-panel ul {
            list-style: none;
            padding-left: 0;
            margin: 6px 0;
        }
        .brain-panel li {
            position: relative;
            padding-left: 16px;
            margin: 4px 0;
            font-size: 13px;
            line-height: 1.6;
            color: var(--text-secondary);
        }
        .brain-panel li::before {
            content: '·';
            position: absolute;
            left: 4px;
            color: var(--brain);
            font-weight: 700;
        }
        .brain-panel p {
            font-size: 13px;
            line-height: 1.6;
            color: var(--text-secondary);
            margin: 6px 0;
        }
        .note-pill {
            display: inline;
            background: rgba(74, 158, 173, 0.15);
            color: var(--brain);
            padding: 1px 8px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
        }

        /* ── Engagement metrics ── */
        .engagement-metrics {
            display: flex;
            gap: 12px;
            font-size: 12px;
            color: var(--text-secondary);
        }
        .engagement-metric {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .engagement-metric svg {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
        }

        /* ── Card meta (author + status + badge row) ── */
        .card-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* ── Brain badge (queue cards) ── */
        .brain-badge {
            font-size: 10px;
            font-weight: 700;
            color: var(--brain);
            border: 1px solid var(--brain);
            padding: 1px 5px;
            border-radius: 2px;
            letter-spacing: 0.5px;
            flex-shrink: 0;
        }

        /* ── Review page two-column layout ── */
        .review-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            align-items: start;
            padding: 8px 0 0;
        }
        .review-left {
            position: sticky;
            top: 64px;
            max-height: calc(100vh - 72px);
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }
        .review-left::-webkit-scrollbar { width: 4px; }
        .review-left::-webkit-scrollbar-thumb { background: var(--border); }

        /* ── Status bar (review detail) ── */
        .status-bar {
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* ── Copy button ── */
        .btn-copy {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }
        .btn-copy:hover { background: var(--surface-2); color: var(--text); border-color: var(--text-secondary); }

        /* ── Reply composer (full width below grid) ── */
        .reply-composer {
            border-top: 1px solid var(--border);
            padding: 20px 0 32px;
            margin-top: 8px;
        }
        .composer-actions {
            display: flex;
            gap: 8px;
            margin: 16px 0 0;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            /* Header: stack on mobile */
            .header-inner {
                flex-wrap: wrap;
                gap: 4px;
            }
            .header h1 { font-size: 18px; }

            /* Tabs: larger touch targets */
            .tab {
                padding: 14px 14px;
                font-size: 15px;
            }
            .tab-count { font-size: 13px; }

            /* Cards: better mobile spacing */
            .card { padding: 14px 12px; }
            .card-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 6px;
            }
            .card-author { font-size: 16px; }
            .card-time { font-size: 14px; }
            .card-status { font-size: 13px; padding: 3px 10px; }
            .post-content { font-size: 16px; }
            .reply-preview { font-size: 15px; padding: 10px 12px; }
            .reply-label { font-size: 13px; }
            .error-msg { font-size: 15px; }

            /* Buttons: larger touch targets */
            .btn { padding: 10px 16px; font-size: 15px; }
            .btn-sm { padding: 8px 14px; font-size: 14px; }

            /* Section labels & meta */
            .section-label { font-size: 13px; }
            .suggestion-label { font-size: 14px; }
            .engagement-metrics { font-size: 14px; }
            .engagement-metric svg { width: 16px; height: 16px; }
            .char-bar-label { font-size: 14px; }
            .char-counter { font-size: 14px; }
            .audit-table { font-size: 14px; }
            .copy-btn { font-size: 14px; }
            .quota-badge { font-size: 14px; }
            .quota-label { font-size: 14px; }
            .brain-badge { font-size: 12px; }

            /* Brain panel: bigger text */
            .brain-panel li { font-size: 15px; }
            .brain-panel p { font-size: 15px; }
            .brain-panel h2 { font-size: 17px; }
            .brain-panel h3 { font-size: 15px; }

            /* Empty state */
            .empty-state h2 { font-size: 20px; }
            .empty-state p { font-size: 15px; }

            /* Review detail: single column with reordered sections */
            .review-layout {
                grid-template-columns: 1fr;
                gap: 16px;
            }
            .review-left {
                position: static;
                max-height: none;
                overflow-y: visible;
                order: 2; /* Original post below Brain + AI suggestions */
            }
            .review-right {
                order: 1; /* Brain + AI suggestions first on mobile */
            }
            /* Within review-right, Brain comes before AI suggestions */
            .review-right { display: flex; flex-direction: column; }
            .review-brain { order: 1; }
            .review-suggestions { order: 2; }

            /* Reply composer */
            .reply-composer {
                position: sticky;
                bottom: 0;
                background: var(--bg);
                padding: 12px 0 16px;
                margin-top: 0;
                z-index: 50;
                border-top: 1px solid var(--border);
            }
            .edit-area {
                min-height: 100px;
                font-size: 16px; /* prevent iOS zoom on focus */
            }

            /* Suggestion box */
            .suggestion-box { padding: 10px 12px; }
            .brain-panel { padding: 12px; }

            /* Status bar: wrap nicely */
            .status-bar { gap: 8px; }

            /* Composer actions: stack on mobile */
            .composer-actions {
                flex-direction: column-reverse;
                gap: 10px;
            }
            .composer-actions > div {
                display: flex;
                gap: 8px;
            }
            .composer-actions .btn {
                flex: 1;
                justify-content: center;
                padding: 12px 16px;
            }
        }
        @media (max-width: 480px) {
            /* Even tighter mobile */
            .container { padding: 0 10px; }

            .header h1 { font-size: 16px; }
            .header h1 a { gap: 5px; }

            .tab { padding: 12px 10px; font-size: 14px; }

            /* Stack card actions vertically */
            .card-actions {
                flex-direction: column;
            }
            .btn { justify-content: center; width: 100%; }

            /* Quota badge: compact */
            .quota-badge { font-size: 13px; }
            .quota-bar-track { width: 48px; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container header-inner">
            <h1><a href="{{ prefix }}/review">Reply Review</a></h1>
            {% block header_right %}{% endblock %}
        </div>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <script>
        // Shared AJAX utility functions for non-blocking UI updates
        const API_PREFIX = '{{ prefix }}';

        async function apiRequest(url, options = {}) {
            const defaults = {
                headers: { 'Content-Type': 'application/json' },
            };
            const response = await fetch(url, { ...defaults, ...options });
            return response;
        }

        async function approveItem(queueId, editedReply = '', btn = null) {
            if (btn) {
                btn.disabled = true;
                btn.dataset.originalText = btn.textContent;
                btn.textContent = 'Approving...';
            }

            try {
                const res = await apiRequest(`${API_PREFIX}/api/approve/${queueId}`, {
                    method: 'POST',
                    body: JSON.stringify({ edited_reply: editedReply })
                });

                const data = await res.json();
                if (res.ok && data.success) {
                    // Update UI: find card and update status
                    const card = btn ? btn.closest('.card') : null;
                    if (card) {
                        card.style.transition = 'opacity 0.3s';
                        card.style.opacity = '0.5';
                        const statusBadge = card.querySelector('.card-status');
                        if (statusBadge) {
                            statusBadge.textContent = 'approved';
                            statusBadge.className = 'card-status status-approved';
                        }
                        // Remove action buttons
                        const actions = card.querySelector('.card-actions');
                        if (actions) {
                            const forms = actions.querySelectorAll('form');
                            forms.forEach(f => f.remove());
                        }
                    }
                    return { success: true };
                } else {
                    throw new Error(data.error || 'Failed to approve');
                }
            } catch (err) {
                if (btn) {
                    btn.disabled = false;
                    btn.textContent = btn.dataset.originalText || 'Approve';
                }
                alert('Error: ' + err.message);
                return { success: false, error: err.message };
            }
        }

        async function rejectItem(queueId, btn = null) {
            if (btn) {
                btn.disabled = true;
                btn.dataset.originalText = btn.textContent;
                btn.textContent = 'Rejecting...';
            }

            try {
                const res = await apiRequest(`${API_PREFIX}/api/reject/${queueId}`, {
                    method: 'POST'
                });

                const data = await res.json();
                if (res.ok && data.success) {
                    // Update UI: find card and update status
                    const card = btn ? btn.closest('.card') : null;
                    if (card) {
                        card.style.transition = 'opacity 0.3s';
                        card.style.opacity = '0.5';
                        const statusBadge = card.querySelector('.card-status');
                        if (statusBadge) {
                            statusBadge.textContent = 'rejected';
                            statusBadge.className = 'card-status status-rejected';
                        }
                        // Remove action buttons
                        const actions = card.querySelector('.card-actions');
                        if (actions) {
                            const forms = actions.querySelectorAll('form');
                            forms.forEach(f => f.remove());
                        }
                    }
                    return { success: true };
                } else {
                    throw new Error(data.error || 'Failed to reject');
                }
            } catch (err) {
                if (btn) {
                    btn.disabled = false;
                    btn.textContent = btn.dataset.originalText || 'Reject';
                }
                alert('Error: ' + err.message);
                return { success: false, error: err.message };
            }
        }

        async function saveItem(queueId, editedReply, btn = null) {
            if (btn) {
                btn.disabled = true;
                btn.dataset.originalText = btn.textContent;
                btn.textContent = 'Saving...';
            }

            try {
                const res = await apiRequest(`${API_PREFIX}/api/save/${queueId}`, {
                    method: 'POST',
                    body: JSON.stringify({ edited_reply: editedReply })
                });

                const data = await res.json();
                if (res.ok && data.success) {
                    if (btn) {
                        btn.textContent = 'Saved!';
                        setTimeout(() => {
                            btn.disabled = false;
                            btn.textContent = btn.dataset.originalText || 'Save Draft';
                        }, 1500);
                    }
                    return { success: true };
                } else {
                    throw new Error(data.error || 'Failed to save');
                }
            } catch (err) {
                if (btn) {
                    btn.disabled = false;
                    btn.textContent = btn.dataset.originalText || 'Save Draft';
                }
                alert('Error: ' + err.message);
                return { success: false, error: err.message };
            }
        }
    </script>
    <script>
        // Post content renderer: linkify URLs, @mentions, #hashtags, $cashtags
        function renderPostContent(text) {
            if (!text) return '';
            // Escape HTML first
            let html = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            // URLs → clickable short links
            html = html.replace(/(https?:\/\/[^\s<]+)/g, function(url) {
                try {
                    const domain = new URL(url).hostname.replace('www.', '');
                    return '<a class="post-link" href="' + url + '" target="_blank" rel="noopener">' + domain + '</a>';
                } catch(e) {
                    return '<a class="post-link" href="' + url + '" target="_blank" rel="noopener">' + url + '</a>';
                }
            });
            // @mentions
            html = html.replace(/@(\w{1,15})/g, '<a class="post-mention" href="https://x.com/$1" target="_blank" rel="noopener">@$1</a>');
            // $cashtags (before hashtags to avoid conflict)
            html = html.replace(/\$([A-Za-z]{1,10})\b/g, '<span class="post-cashtag">$$$1</span>');
            // #hashtags
            html = html.replace(/#(\w+)/g, '<span class="post-hashtag">#$1</span>');
            return html;
        }

        // Simple markdown renderer for brain context
        function renderBrainMarkdown(text) {
            if (!text) return '';
            let html = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            // [[note name]] → pill badge
            html = html.replace(/\[\[([^\]]+)\]\]/g, '<span class="note-pill">$1</span>');
            // ### heading
            html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
            // ## heading
            html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
            // **bold**
            html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            // *italic*
            html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
            // Bullet lists: convert consecutive lines starting with - into <ul>
            html = html.replace(/(^|\n)(- .+(?:\n- .+)*)/g, function(match, prefix, block) {
                const items = block.split('\n').map(function(line) {
                    return '<li>' + line.replace(/^- /, '') + '</li>';
                }).join('');
                return prefix + '<ul>' + items + '</ul>';
            });
            // Wrap remaining plain lines in <p> (skip empty lines and already-wrapped tags)
            const lines = html.split('\n');
            const result = [];
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) { result.push(''); continue; }
                if (line.startsWith('<h') || line.startsWith('<ul') || line.startsWith('<li') || line.startsWith('<p')) {
                    result.push(line);
                } else {
                    result.push('<p>' + line + '</p>');
                }
            }
            return result.join('\n');
        }

        // Apply renderPostContent to all .post-content elements on page load
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('.post-content[data-raw]').forEach(function(el) {
                el.innerHTML = renderPostContent(el.dataset.raw);
            });
            document.querySelectorAll('.brain-content[data-raw]').forEach(function(el) {
                el.innerHTML = renderBrainMarkdown(el.dataset.raw);
            });
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
